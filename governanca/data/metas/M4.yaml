descricao: |
  A Camada B. Toda decisão ligada a uma meta, todo resultado a um experimento, todo arquivo a uma decisão, zero nós órfãos. Esta meta existe para que as tarefas de governança tenham a que se vincular — sem ela, o próprio trabalho de rastreabilidade seria órfão no grafo.
